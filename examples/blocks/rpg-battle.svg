    <g transform="translate(0, 0)">
      <defs><clipPath id="cmdrev-0"><rect x="109" y="-14" width="208" height="28"><animate attributeName="width" values="0;8;16;24;32;40;48;56;64;72;80;88;96;104;112;120;128;136;144;152;160;168;176;184;192;200;208" keyTimes="0.0000;0.0385;0.0769;0.1154;0.1538;0.1923;0.2308;0.2692;0.3077;0.3462;0.3846;0.4231;0.4615;0.5000;0.5385;0.5769;0.6154;0.6538;0.6923;0.7308;0.7692;0.8077;0.8462;0.8846;0.9231;0.9615;1.0000" calcMode="discrete" begin="0ms" dur="1200ms" fill="freeze"/></rect></clipPath></defs>
