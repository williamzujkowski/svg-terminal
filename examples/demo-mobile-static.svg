  <desc>$ cat /etc/motd
SVG-TERMINAL v2026.05
Animated SVGs for your README.
Declarative YAML in.
$ neofetch
dev@svg-terminal
OS:        TerminalOS v1.0
Shell:     bash 5.2
Uptime:    a long time
Role:      Library Author
Location:  localhost
Languages: TypeScript, SVG, SMIL
Editor:    vim

● ● ● ● ● ● ● ●
$ gh api users/octocat/repos
TypeScript  █████░░░░░░░  42%
Rust        ███░░░░░░░░░  24%
Python      ██░░░░░░░░░░  18%
Go          █░░░░░░░░░░░  11%
Lua         █░░░░░░░░░░░   5%
$ date +%H:%M:%S
uptime  13:37:00
$ made-with --love
built with care
$ palette
theme: █ █ █ █ █ █ █ █ █ █ █ █ █ █ █ █</desc>
  <style>.tt { font-family: JetBrains Mono, Fira Code, Ubuntu Mono, Consolas, Monaco, monospace; font-size: 14px; white-space: pre; }</style>
  <defs>
    
    
    <filter id="shadow" x="-8%" y="-8%" width="116%" height="120%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="8"/>
      <feOffset dx="0" dy="6" result="offsetblur"/>
      <feFlood flood-color="#000000" flood-opacity="0.55"/>
      <feComposite in2="offsetblur" operator="in"/>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <clipPath id="terminalViewport">
      <rect x="0" y="40" width="360" height="731"/>
    </clipPath>
  </defs>

  <g filter="url(#shadow)">
    
    <rect x="0" y="0" width="360" height="771"
